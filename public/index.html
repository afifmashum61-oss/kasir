<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kasirku POS - Toolbar Floating QRIS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute; left: 0; top: 0; width: 100%; background: white; color: black;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Master Sembako List
    const MASTER_SEMBAKO = [
      { id: 'smb-01', title: 'Beras Ramos Premium 5kg', price: 74000, unit: 'Karung', stock: 50 },
      { id: 'smb-02', title: 'Minyak Goreng Bimoli 2L', price: 34500, unit: 'Pouch', stock: 65 },
      { id: 'smb-03', title: 'Gula Pasir Gulaku 1kg', price: 17500, unit: 'Bungkus', stock: 40 },
      { id: 'smb-04', title: 'Telur Ayam Negeri 1kg', price: 29000, unit: 'Kg', stock: 35 },
      { id: 'smb-05', title: 'Indomie Goreng Original 85g', price: 3100, unit: 'Bungkus', stock: 200 },
      { id: 'smb-06', title: 'Tepung Terigu Segitiga Biru 1kg', price: 12500, unit: 'Bungkus', stock: 30 },
      { id: 'smb-07', title: 'Kopi Kapal Api Special 165g', price: 14500, unit: 'Bungkus', stock: 45 },
      { id: 'smb-08', title: 'Deterjen Rinso Anti Noda 770g', price: 22500, unit: 'Bungkus', stock: 25 }
    ];

    function App() {
      // Active Tabs: 'home', 'bookings', 'qris', 'support', 'account'
      const [activeTab, setActiveTab] = useState('home');

      // State Grafik Penjualan (Diagram Batang Murni)
      const [hoveredBar, setHoveredBar] = useState(null);

      // Inventaris Sembako
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('master_sembako_clean');
        return saved ? JSON.parse(saved) : MASTER_SEMBAKO;
      });

      // Form Pencatatan Penjualan
      const [selectedSembakoId, setSelectedSembakoId] = useState('');
      const [customTitle, setCustomTitle] = useState('');
      const [inputPrice, setInputPrice] = useState('');
      const [inputQty, setInputQty] = useState(1);
      const [inputUnit, setInputUnit] = useState('Pcs');

      // Cart Nota Penjualan Aktif
      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('nota_sembako_cart_clean');
        return saved ? JSON.parse(saved) : [];
      });

      // Transaksi Tersimpan
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('nota_sembako_transactions_clean');
        return saved ? JSON.parse(saved) : [];
      });

      // Baseline sales data 7 hari terakhir
      const baseWeeklySales = useMemo(() => [
        { day: 'Senin', label: 'Sen', total: 540000, count: 7, tunai: 380000, qris: 160000 },
        { day: 'Selasa', label: 'Sel', total: 680000, count: 9, tunai: 450000, qris: 230000 },
        { day: 'Rabu', label: 'Rab', total: 420000, count: 6, tunai: 300000, qris: 120000 },
        { day: 'Kamis', label: 'Kam', total: 910000, count: 12, tunai: 590000, qris: 320000 },
        { day: 'Jumat', label: 'Jum', total: 780000, count: 10, tunai: 480000, qris: 300000 },
        { day: 'Sabtu', label: 'Sab', total: 1250000, count: 18, tunai: 800000, qris: 450000 },
        { day: 'Minggu', label: 'Min', total: 950000, count: 13, tunai: 600000, qris: 350000 },
      ], []);

      const totalRealSales = useMemo(() => transactions.reduce((acc, t) => acc + t.total, 0), [transactions]);
      const totalRealTunai = useMemo(() => transactions.filter(t => t.paymentMethod === 'TUNAI').reduce((acc, t) => acc + t.total, 0), [transactions]);
      const totalRealQris = useMemo(() => transactions.filter(t => t.paymentMethod === 'QRIS').reduce((acc, t) => acc + t.total, 0), [transactions]);
      const totalRealCount = transactions.length;

      // Data grafik yang menggabungkan transaksi real saat ini ke hari Minggu (Hari Ini)
      const weeklyChartData = useMemo(() => {
        return baseWeeklySales.map((item, index) => {
          if (index === 6) {
            return {
              ...item,
              total: item.total + totalRealSales,
              count: item.count + totalRealCount,
              tunai: item.tunai + totalRealTunai,
              qris: item.qris + totalRealQris,
              isToday: true
            };
          }
          return item;
        });
      }, [baseWeeklySales, totalRealSales, totalRealCount, totalRealTunai, totalRealQris]);

      const grandTotalSales = useMemo(() => weeklyChartData.reduce((acc, d) => acc + d.total, 0), [weeklyChartData]);
      const grandTotalCount = useMemo(() => weeklyChartData.reduce((acc, d) => acc + d.count, 0), [weeklyChartData]);
      const grandTotalTunai = useMemo(() => weeklyChartData.reduce((acc, d) => acc + d.tunai, 0), [weeklyChartData]);
      const grandTotalQris = useMemo(() => weeklyChartData.reduce((acc, d) => acc + d.qris, 0), [weeklyChartData]);
      const maxChartValue = useMemo(() => Math.max(...weeklyChartData.map(d => d.total), 1000000), [weeklyChartData]);

      // Modals
      const [cashGiven, setCashGiven] = useState('');
      const [currentReceipt, setCurrentReceipt] = useState(null);

      // Modal Sembako Masuk & Edit
      const [isMasukModalOpen, setIsMasukModalOpen] = useState(false);
      const [masukForm, setMasukForm] = useState({ title: '', price: '', stock: 20, unit: 'Pcs' });

      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editForm, setEditForm] = useState({ id: '', title: '', price: '', stock: '', unit: 'Pcs' });

      useEffect(() => { localStorage.setItem('master_sembako_clean', JSON.stringify(inventory)); }, [inventory]);
      useEffect(() => { localStorage.setItem('nota_sembako_cart_clean', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('nota_sembako_transactions_clean', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      // Select Sembako Handler
      const handleSelectSembakoChange = (id) => {
        setSelectedSembakoId(id);
        if (!id) {
          setCustomTitle('');
          setInputPrice('');
          setInputUnit('Pcs');
          return;
        }
        const found = inventory.find(item => item.id === id);
        if (found) {
          setCustomTitle(found.title);
          setInputPrice(found.price.toString());
          setInputUnit(found.unit || 'Pcs');
        }
      };

      // Tambah Penjualan
      const handleAddPenjualan = (e) => {
        e.preventDefault();
        const titleToUse = customTitle.trim();
        const priceToUse = parseFloat(inputPrice) || 0;
        const qtyToUse = parseInt(inputQty) || 1;

        if (!titleToUse || priceToUse <= 0) {
          alert('Pilih/ketik nama sembako dan harga jual dengan benar!');
          return;
        }

        if (selectedSembakoId) {
          const masterItem = inventory.find(i => i.id === selectedSembakoId);
          if (masterItem && masterItem.stock < qtyToUse) {
            alert(`Stok "${masterItem.title}" hanya tersisa ${masterItem.stock} ${masterItem.unit}.`);
            return;
          }
        }

        const newItem = {
          id: 'item-' + Date.now(),
          sembakoId: selectedSembakoId,
          title: titleToUse,
          price: priceToUse,
          quantity: qtyToUse,
          unit: inputUnit
        };

        setCart(prev => [...prev, newItem]);
        setSelectedSembakoId('');
        setCustomTitle('');
        setInputPrice('');
        setInputQty(1);
        setInputUnit('Pcs');
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotalCount = useMemo(() => cart.reduce((acc, i) => acc + i.quantity, 0), [cart]);
      const subtotal = useMemo(() => cart.reduce((acc, i) => acc + (i.price * i.quantity), 0), [cart]);

      // Proses Pembayaran Tunai atau QRIS
      const processPenjualan = (method = 'TUNAI') => {
        if (cart.length === 0) {
          alert('Belum ada item barang dalam pencatatan penjualan!');
          return;
        }

        const cashNum = method === 'QRIS' ? subtotal : (parseFloat(cashGiven) || subtotal);
        if (method === 'TUNAI' && cashNum < subtotal) {
          alert(`Uang diterima kurang! Diperlukan setidaknya ${formatRp(subtotal)}`);
          return;
        }

        const change = method === 'QRIS' ? 0 : Math.max(0, cashNum - subtotal);
        const newReceipt = {
          id: 'NOTA-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
          items: [...cart],
          total: subtotal,
          paymentMethod: method,
          cashGiven: cashNum,
          change
        };

        setInventory(prev => prev.map(inv => {
          const soldItems = cart.filter(c => c.sembakoId === inv.id);
          const totalSoldQty = soldItems.reduce((acc, i) => acc + i.quantity, 0);
          if (totalSoldQty > 0) {
            return { ...inv, stock: Math.max(0, inv.stock - totalSoldQty) };
          }
          return inv;
        }));

        setTransactions(prev => [newReceipt, ...prev]);
        setCurrentReceipt(newReceipt);
        setCart([]);
        setCashGiven('');
      };

      // Tambah Sembako Baru
      const handleMasukSubmit = (e) => {
        e.preventDefault();
        if (!masukForm.title || !masukForm.price) {
          alert('Nama sembako dan harga jual wajib diisi!');
          return;
        }

        const newProd = {
          id: 'smb-' + Date.now(),
          title: masukForm.title,
          price: parseFloat(masukForm.price),
          unit: masukForm.unit || 'Pcs',
          stock: parseInt(masukForm.stock) || 10
        };

        setInventory(prev => [newProd, ...prev]);
        setIsMasukModalOpen(false);
        setMasukForm({ title: '', price: '', stock: 20, unit: 'Pcs' });
        alert(`SUKSES! Stok Sembako Masuk "${newProd.title}" (+${newProd.stock} ${newProd.unit}) telah ditambahkan.`);
      };

      // Edit Item Stok
      const openEditModal = (item) => {
        setEditForm({
          id: item.id,
          title: item.title,
          price: item.price.toString(),
          stock: item.stock.toString(),
          unit: item.unit || 'Pcs'
        });
        setIsEditModalOpen(true);
      };

      const handleSaveEditItem = (e) => {
        e.preventDefault();
        if (!editForm.title || !editForm.price) {
          alert('Nama sembako dan harga jual wajib diisi!');
          return;
        }

        setInventory(prev => prev.map(inv => {
          if (inv.id === editForm.id) {
            return {
              ...inv,
              title: editForm.title.trim(),
              price: parseFloat(editForm.price) || 0,
              stock: parseInt(editForm.stock) || 0,
              unit: editForm.unit.trim() || 'Pcs'
            };
          }
          return inv;
        }));

        setIsEditModalOpen(false);
        alert(`BERHASIL! Data Sembako "${editForm.title}" telah diperbarui.`);
      };

      const handleDeleteItem = (id, title) => {
        if (confirm(`Yakin ingin menghapus sembako "${title}" dari daftar stok?`)) {
          setInventory(prev => prev.filter(inv => inv.id !== id));
          setIsEditModalOpen(false);
        }
      };

      const formatRp = (val) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-2xl mx-auto bg-white shadow-sm border-x border-slate-200 relative pb-16">

          {/* MAIN APP HEADER */}
          <header className="bg-slate-900 text-white px-4 py-3 border-b border-slate-800 sticky top-0 z-30 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black shadow">
                <i data-lucide="store" className="w-5 h-5"></i>
              </div>
              <div>
                <h1 className="text-sm font-extrabold tracking-wide">Toko Sembako Berkah Jaya</h1>
                <p className="text-[11px] text-emerald-400 font-semibold">Pencatatan Penjualan & Floating QRIS</p>
              </div>
            </div>

            <button
              onClick={() => setIsMasukModalOpen(true)}
              className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm transition"
            >
              <i data-lucide="plus" className="w-4 h-4"></i>
              <span>+ Stok Masuk</span>
            </button>
          </header>

          {/* MAIN RESPONSIVE CONTENT AREA */}
          <main className="flex-1 p-3 sm:p-4 bg-slate-50 space-y-4">

            {/* TAB CONTENT: KASIR PENCATATAN UTAMA & DASHBOARD GRAFIK */}
            {activeTab === 'home' && (
              <div className="space-y-4">

                {/* CARD GRAFIK PENJUALAN DASHBOARD (DIAGRAM BATANG MURNI) */}
                <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                  {/* Header Grafik */}
                  <div className="flex justify-between items-center border-b border-gray-100 pb-2.5">
                    <div className="flex items-center gap-1.5">
                      <div className="p-1.5 bg-emerald-100 text-emerald-800 rounded-lg">
                        <i data-lucide="bar-chart-2" className="w-4 h-4"></i>
                      </div>
                      <div>
                        <h3 className="font-extrabold text-xs text-slate-800 uppercase tracking-wide">
                          GRAFIK PENJUALAN BATANG
                        </h3>
                        <p className="text-[10px] text-slate-500 font-semibold">
                          Omset Penjualan 7 Hari Terakhir & Real-time Update
                        </p>
                      </div>
                    </div>

                    <span className="text-[10px] bg-emerald-100 text-emerald-800 font-extrabold px-2.5 py-1 rounded-full flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span>Grafik Batang Live</span>
                    </span>
                  </div>

                  {/* Summary Stat Mini Badges */}
                  <div className="grid grid-cols-3 gap-2">
                    <div className="bg-emerald-50 border border-emerald-200/60 p-2 rounded-xl text-center">
                      <span className="text-[10px] font-bold text-emerald-800 block">TOTAL OMSET</span>
                      <span className="text-xs sm:text-sm font-black text-emerald-700">{formatRp(grandTotalSales)}</span>
                    </div>
                    <div className="bg-slate-50 border border-slate-200/60 p-2 rounded-xl text-center">
                      <span className="text-[10px] font-bold text-slate-500 block">TOTAL NOTA</span>
                      <span className="text-xs sm:text-sm font-black text-slate-800">{grandTotalCount} Transaksi</span>
                    </div>
                    <div className="bg-amber-50 border border-amber-200/60 p-2 rounded-xl text-center">
                      <span className="text-[10px] font-bold text-amber-800 block">HARI INI</span>
                      <span className="text-xs sm:text-sm font-black text-amber-700">
                        {formatRp(weeklyChartData[6].total)}
                      </span>
                    </div>
                  </div>

                  {/* SVG CHART CONTAINER */}
                  <div className="relative bg-slate-900 rounded-2xl p-3 text-white overflow-hidden shadow-inner space-y-2">
                    <div className="flex justify-between items-center text-xs border-b border-slate-800 pb-2">
                      <span className="text-slate-400 text-[11px] font-medium">
                        {hoveredBar !== null ? (
                          <span className="text-emerald-400 font-bold">
                            📍 {weeklyChartData[hoveredBar].day} {weeklyChartData[hoveredBar].isToday ? '(Hari Ini)' : ''}: {weeklyChartData[hoveredBar].count} Transaksi
                          </span>
                        ) : (
                          <span>Sentuh batang grafik untuk melihat rincian</span>
                        )}
                      </span>
                      <span className="text-emerald-400 font-black text-sm">
                        {hoveredBar !== null ? formatRp(weeklyChartData[hoveredBar].total) : formatRp(grandTotalSales)}
                      </span>
                    </div>

                    <div className="w-full overflow-x-auto hide-scrollbar pt-2 pb-1">
                      <svg viewBox="0 0 500 170" className="w-full h-44 min-w-[320px]">
                        <defs>
                          <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#34d399" />
                            <stop offset="100%" stopColor="#059669" />
                          </linearGradient>
                          <linearGradient id="todayGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#facc15" />
                            <stop offset="100%" stopColor="#eab308" />
                          </linearGradient>
                        </defs>

                        {/* Grid lines */}
                        <line x1="30" y1="30" x2="480" y2="30" stroke="#334155" strokeDasharray="3 3" strokeWidth="1" />
                        <line x1="30" y1="70" x2="480" y2="70" stroke="#334155" strokeDasharray="3 3" strokeWidth="1" />
                        <line x1="30" y1="110" x2="480" y2="110" stroke="#334155" strokeDasharray="3 3" strokeWidth="1" />
                        <line x1="30" y1="140" x2="480" y2="140" stroke="#475569" strokeWidth="1" />

                        {/* Y Labels */}
                        <text x="5" y="34" fill="#94a3b8" fontSize="9" fontWeight="bold">{(maxChartValue / 1000000).toFixed(1)}M</text>
                        <text x="5" y="74" fill="#94a3b8" fontSize="9" fontWeight="bold">{(maxChartValue * 0.6 / 1000000).toFixed(1)}M</text>
                        <text x="5" y="114" fill="#94a3b8" fontSize="9" fontWeight="bold">{(maxChartValue * 0.3 / 1000000).toFixed(1)}M</text>

                        {/* Render Diagram Batang */}
                        {weeklyChartData.map((d, i) => {
                          const barHeight = Math.max(12, (d.total / maxChartValue) * 105);
                          const xPos = 40 + i * 62;
                          const yPos = 140 - barHeight;
                          const isHovered = hoveredBar === i;

                          return (
                            <g
                              key={d.day}
                              onMouseEnter={() => setHoveredBar(i)}
                              onMouseLeave={() => setHoveredBar(null)}
                              onClick={() => setHoveredBar(i)}
                              className="cursor-pointer"
                            >
                              {isHovered && (
                                <rect x={xPos - 6} y="20" width="48" height="125" fill="#1e293b" rx="8" opacity="0.6" />
                              )}
                              <rect
                                x={xPos}
                                y={yPos}
                                width="36"
                                height={barHeight}
                                rx="6"
                                fill={d.isToday ? 'url(#todayGrad)' : 'url(#barGrad)'}
                                stroke={isHovered ? '#ffffff' : 'none'}
                                strokeWidth={isHovered ? '2' : '0'}
                              />
                              <text
                                x={xPos + 18}
                                y={Math.max(18, yPos - 6)}
                                fill={d.isToday ? '#facc15' : '#34d399'}
                                fontSize="8"
                                fontWeight="extrabold"
                                textAnchor="middle"
                              >
                                {(d.total / 1000).toFixed(0)}rb
                              </text>
                              <text
                                x={xPos + 18}
                                y="156"
                                fill={d.isToday ? '#facc15' : '#cbd5e1'}
                                fontSize="10"
                                fontWeight={d.isToday || isHovered ? '900' : 'bold'}
                                textAnchor="middle"
                              >
                                {d.label}
                              </text>
                            </g>
                          );
                        })}
                      </svg>
                    </div>

                    <div className="pt-2 border-t border-slate-800 flex flex-wrap justify-between items-center text-[11px] gap-2">
                      <div className="flex items-center gap-3">
                        <span className="flex items-center gap-1">
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                          <span className="text-slate-300 font-semibold">Tunai: {formatRp(grandTotalTunai)}</span>
                        </span>
                        <span className="flex items-center gap-1">
                          <span className="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block"></span>
                          <span className="text-slate-300 font-semibold">QRIS: {formatRp(grandTotalQris)}</span>
                        </span>
                      </div>
                      <span className="text-amber-400 font-bold">
                        Rata-rata: {formatRp(grandTotalSales / (grandTotalCount || 1))}/Nota
                      </span>
                    </div>

                  </div>
                </div>

                {/* FORM INPUT CEPAT PENJUALAN */}
                <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 className="font-extrabold text-xs text-slate-800 uppercase tracking-wide flex items-center gap-1.5">
                      <i data-lucide="plus-circle" className="w-4 h-4 text-emerald-600"></i>
                      <span>INPUT PENJUALAN SEMBAKO</span>
                    </h3>
                    <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                      Fast Entry
                    </span>
                  </div>

                  <form onSubmit={handleAddPenjualan} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Pilih Sembako Ready:</label>
                      <select
                        value={selectedSembakoId}
                        onChange={(e) => handleSelectSembakoChange(e.target.value)}
                        className="w-full px-3 py-2.5 bg-slate-50 border border-gray-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500"
                      >
                        <option value="">-- Pilih dari Daftar Sembako --</option>
                        {inventory.map(item => (
                          <option key={item.id} value={item.id}>
                            {item.title} - {formatRp(item.price)} (Stok: {item.stock} {item.unit})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>

                  <div className="space-y-1 text-[11px] border-b border-dashed border-gray-300 pb-2">
                    <div className="flex justify-between"><span>No Nota:</span><span className="font-bold">{currentReceipt.id}</span></div>
                    <div className="flex justify-between"><span>Waktu:</span><span>{currentReceipt.date}</span></div>
                    <div className="flex justify-between"><span>Metode:</span><span className="font-bold text-emerald-700">{currentReceipt.paymentMethod}</span></div>
                  </div>

                  <div className="space-y-1.5 border-b border-dashed border-gray-300 pb-2">
                    {currentReceipt.items.map(item => (
                      <div key={item.id} className="flex justify-between font-bold">
                        <span>{item.quantity}x {item.title}</span>
                        <span>{formatRp(item.price * item.quantity)}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-1 text-[11px] pt-1">
                    <div className="flex justify-between font-extrabold text-xs"><span>TOTAL BAYAR:</span><span>{formatRp(currentReceipt.total)}</span></div>
                    <div className="flex justify-between"><span>Uang Diterima:</span><span>{formatRp(currentReceipt.cashGiven)}</span></div>
                    <div className="flex justify-between font-bold"><span>Kembalian:</span><span>{formatRp(currentReceipt.change)}</span></div>
                  </div>

                  <div className="text-center pt-3 border-t border-dashed border-gray-300">
                    <p className="text-[10px] font-bold">Terima Kasih Telah Berbelanja Sembako!</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex-1 py-2.5 bg-slate-800 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i>
                    <span>Cetak Nota</span>
                  </button>
                  <button onClick={() => setCurrentReceipt(null)} className="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs">
                    Selesai
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal EDIT STOK BARANG */}
          {isEditModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <form onSubmit={handleSaveEditItem} className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 relative">
                <button type="button" onClick={() => setIsEditModalOpen(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <div className="flex items-center gap-2 border-b border-gray-100 pb-3">
                  <i data-lucide="edit-3" className="w-5 h-5 text-emerald-600"></i>
                  <h3 className="text-base font-extrabold text-slate-800">Edit Data Stok Sembako</h3>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nama Sembako *</label>
                    <input
                      type="text"
                      required
                      value={editForm.title}
                      onChange={(e) => setEditForm({ ...editForm, title: e.target.value })}
                      placeholder="Nama sembako..."
                      className="w-full px-3 py-2 bg-slate-50 border border-gray-200 rounded-xl font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Harga Jual (Rp) *</label>
                      <input
                        type="number"
                        required
                        value={editForm.price}
                        onChange={(e) => setEditForm({ ...editForm, price: e.target.value })}
                        placeholder="74000"
                        className="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl font-bold text-emerald-700"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jumlah Stok saat ini *</label>
                      <input
                        type="number"
                        required
                        value={editForm.stock}
                        onChange={(e) => setEditForm({ ...editForm, stock: e.target.value })}
                        placeholder="50"
                        className="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl font-bold text-slate-900"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Satuan Barang</label>
                    <input
                      type="text"
                      value={editForm.unit}
                      onChange={(e) => setEditForm({ ...editForm, unit: e.target.value })}
                      placeholder="Karung / Pouch / Kg / Dus / Bungkus / Pcs"
                      className="w-full px-3 py-2 bg-slate-50 border border-gray-200 rounded-xl font-semibold"
                    />
                  </div>
                </div>

                <div className="pt-2 flex gap-2">
                  <button
                    type="button"
                    onClick={() => handleDeleteItem(editForm.id, editForm.title)}
                    className="px-3 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs flex items-center justify-center gap-1 border border-red-200"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                    <span>Hapus</span>
                  </button>

                  <button
                    type="submit"
                    className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1.5"
                  >
                    <i data-lucide="check" className="w-4 h-4"></i>
                    <span>Simpan Perubahan</span>
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Modal Input Sembako Masuk */}
          {isMasukModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <form onSubmit={handleMasukSubmit} className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 relative">
                <button type="button" onClick={() => setIsMasukModalOpen(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <h3 className="text-base font-bold text-slate-800">📥 Input Sembako Baru / Masuk</h3>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nama Sembako *</label>
                    <input
                      type="text"
                      required
                      value={masukForm.title}
                      onChange={(e) => setMasukForm({ ...masukForm, title: e.target.value })}
                      placeholder="Contoh: Beras Ramos 5kg / Minyak Goreng 2L"
                      className="w-full px-3 py-2 border rounded-xl"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Harga Jual (Rp) *</label>
                      <input
                        type="number"
                        required
                        value={masukForm.price}
                        onChange={(e) => setMasukForm({ ...masukForm, price: e.target.value })}
                        placeholder="74000"
                        className="w-full px-3 py-2 border rounded-xl"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jumlah Stok Masuk *</label>
                      <input
                        type="number"
                        required
                        value={masukForm.stock}
                        onChange={(e) => setMasukForm({ ...masukForm, stock: e.target.value })}
                        placeholder="20"
                        className="w-full px-3 py-2 border rounded-xl font-bold text-emerald-700"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Satuan Barang</label>
                    <input
                      type="text"
                      value={masukForm.unit}
                      onChange={(e) => setMasukForm({ ...masukForm, unit: e.target.value })}
                      placeholder="Karung / Pouch / Kg / Dus"
                      className="w-full px-3 py-2 border rounded-xl"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center justify-center gap-1.5"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                  <span>Simpan Sembako Baru</span>
                </button>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
